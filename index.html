<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0f1e">
<title>Snake Food</title>
<style>
  :root {
    --bg: #0a0f1e;
    --panel: #111827;
    --accent: #22c55e;
    --accent-hi: #4ade80;
    --food: #f87171;
    --gold: #fbbf24;
    --danger: #ef4444;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: #e5e7eb;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    touch-action: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    user-select: none;
  }
  .top {
    width: 100%;
    max-width: 520px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 8px 12px 4px;
  }
  .score-wrap .score {
    font-size: 28px;
    font-weight: 800;
    color: var(--accent);
    text-shadow: 0 0 18px rgba(34,197,94,.5);
    transition: transform .12s;
  }
  .score-wrap .score.bump { transform: scale(1.18); }
  .score-wrap .best {
    font-size: 12px;
    color: #9ca3af;
    font-weight: 600;
    letter-spacing: .04em;
  }
  .right-hud {
    text-align: right;
    min-width: 70px;
  }
  #mult {
    font-size: 18px;
    font-weight: 800;
    color: var(--gold);
    text-shadow: 0 0 12px rgba(251,191,36,.6);
    min-height: 22px;
  }
  #combo {
    font-size: 13px;
    font-weight: 700;
    color: #fbbf24cc;
    min-height: 16px;
  }
  #multTimer {
    font-size: 11px;
    color: #fbbf24aa;
  }
  canvas {
    border-radius: 14px;
    background: #111827;
    box-shadow: 0 0 40px rgba(34,197,94,.12), inset 0 0 60px rgba(0,0,0,.4);
    width: min(100vw - 16px, 96vmin);
    height: min(100vw - 16px, 96vmin);
    max-width: 100%;
    max-height: 72vh;
    display: block;
    touch-action: none;
  }
  .controls {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
  }
  .dpad-hidden { display: none !important; }
  button {
    padding: 10px 16px;
    font-size: 14px;
    border: none;
    border-radius: 12px;
    background: #1f2937;
    color: #e5e7eb;
    cursor: pointer;
    font-weight: 600;
    border: 1px solid #374151;
    transition: transform .08s;
  }
  button:active { transform: scale(.95); }
  button.primary {
    background: var(--accent);
    color: #0a0f1e;
    border-color: var(--accent);
  }
  button.active-toggle {
    background: #166534;
    border-color: var(--accent);
    color: #fff;
  }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 64px);
    grid-template-rows: repeat(3, 64px);
    gap: 6px;
    margin-top: 8px;
  }
  .dpad button {
    padding: 0;
    font-size: 24px;
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 14px;
  }
  .dpad .empty { background: transparent; border: none; }

  /* Overlay */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,15,30,.88);
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 20px;
    text-align: center;
  }
  .overlay h2 {
    font-size: 42px;
    margin-bottom: 6px;
    color: var(--accent);
    text-shadow: 0 0 24px var(--accent);
  }
  .overlay h2.over {
    color: var(--food);
    text-shadow: 0 0 24px var(--food);
  }
  .overlay .sub {
    font-size: 15px;
    color: #9ca3af;
    margin-bottom: 8px;
  }
  .overlay .final {
    font-size: 56px;
    font-weight: 900;
    margin: 8px 0 4px;
    line-height: 1;
  }
  .overlay .new-best {
    color: var(--gold);
    font-weight: 800;
    font-size: 18px;
    letter-spacing: .08em;
    text-shadow: 0 0 16px var(--gold);
    animation: pulseGold 1.1s ease-in-out infinite;
  }
  @keyframes pulseGold {
    50% { transform: scale(1.08); text-shadow: 0 0 28px var(--gold); }
  }
  .overlay .best-line {
    font-size: 14px;
    color: #9ca3af;
    margin-bottom: 14px;
  }
  .hidden { display: none !important; }
  .hint {
    font-size: 12.5px;
    color: #6b7280;
    margin-top: 14px;
    line-height: 1.55;
  }
  .hint span {
    display: inline-block;
    background: #1f2937;
    padding: 2px 7px;
    border-radius: 6px;
    margin: 0 2px;
    color: #d1d5db;
  }
  .mode-row {
    display: flex;
    gap: 6px;
    margin: 14px 0 4px;
    justify-content: center;
    background: #0b1222;
    padding: 5px;
    border-radius: 12px;
    border: 1px solid #1f2937;
  }
  .mode-btn {
    padding: 9px 16px;
    font-size: 13px;
    border-radius: 9px;
    background: transparent;
    border: none;
    color: #9ca3af;
    font-weight: 700;
  }
  .mode-btn.active {
    background: #166534;
    color: #fff;
    box-shadow: 0 0 12px rgba(34,197,94,.25);
  }
  .milestone {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 32px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 20px var(--accent);
    pointer-events: none;
    opacity: 0;
    transition: opacity .3s, transform .4s;
    z-index: 5;
  }
  .milestone.show {
    opacity: 1;
    transform: translate(-50%, -80%);
  }
</style>
</head>
<body>
  <div class="top">
    <div class="score-wrap">
      <div class="score" id="score">0</div>
      <div class="best">BEST <span id="best">0</span></div>
    </div>
    <div class="right-hud">
      <div id="mult"></div>
      <div id="combo"></div>
      <div id="multTimer"></div>
    </div>
  </div>

  <div style="position:relative;">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="milestone" id="milestone"></div>
  </div>

  <div class="controls">
    <button onclick="restartGame()" class="primary">Play</button>
    <button onclick="toggleSound()" id="soundBtn">🔊</button>
    <button onclick="togglePause()" id="pauseBtn">⏸</button>
    <button onclick="toggleDpad()" id="dpadBtn">D-Pad</button>
  </div>

  <div class="dpad dpad-hidden" id="dpad">
    <div class="empty"></div>
    <button onclick="setDir(0,-1)">▲</button>
    <div class="empty"></div>
    <button onclick="setDir(-1,0)">◀</button>
    <div class="empty"></div>
    <button onclick="setDir(1,0)">▶</button>
    <div class="empty"></div>
    <button onclick="setDir(0,1)">▼</button>
    <div class="empty"></div>
  </div>

  <!-- START / GAME OVER -->
  <div id="overlay" class="overlay">
    <h2 id="overlayTitle">SNAKE</h2>
    <div class="sub" id="overlaySub">Eat food. Build combos. Don't crash.</div>
    <div class="final" id="overlayScore"></div>
    <div class="new-best hidden" id="newBest">NEW BEST!</div>
    <div class="best-line" id="bestLine"></div>

    <div class="mode-row" id="modeRow">
      <button class="mode-btn" data-mode="easy" onclick="setMode('easy')">Easy</button>
      <button class="mode-btn active" data-mode="normal" onclick="setMode('normal')">Normal</button>
      <button class="mode-btn" data-mode="hard" onclick="setMode('hard')">Hard</button>
    </div>

    <button onclick="restartGame()" class="primary" style="padding:14px 40px;font-size:18px;margin-top:10px;">▶ Play</button>

    <div class="hint" id="startHint">
      <span>Swipe</span> anywhere on the board to move<br>
      Optional D-Pad button below · Arrows / WASD · Space = Pause
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const GRID = 20;

function cols(){ return canvas.width / GRID; }
function rows(){ return canvas.height / GRID; }

let snake = [];
let dir = {x:1, y:0};
let nextDir = {x:1, y:0};
let food = null;
let powerup = null;
let score = 0;
let best = parseInt(localStorage.getItem('snakeBest') || '0');
let gameOver = false;
let started = false;
let paused = false;
let speed = 120;
let lastTime = 0;
let acc = 0;
let soundOn = true;
let multiplier = 1;
let multTimer = 0;
let particles = [];
let shake = 0;
let scorePop = 0;
let hitStop = 0;
let mode = 'normal';
let combo = 0;
let maxCombo = 0;
let nearMiss = 0;
let trail = [];
let headSmooth = {x:0, y:0};
let milestonesHit = new Set();

const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const multEl = document.getElementById('mult');
const comboEl = document.getElementById('combo');
const multTimerEl = document.getElementById('multTimer');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlaySub = document.getElementById('overlaySub');
const overlayScore = document.getElementById('overlayScore');
const newBestEl = document.getElementById('newBest');
const bestLine = document.getElementById('bestLine');
const modeRow = document.getElementById('modeRow');
const startHint = document.getElementById('startHint');
const milestoneEl = document.getElementById('milestone');

bestEl.textContent = best;

function resizeCanvas(){
  const maxW = Math.min(window.innerWidth - 16, window.innerHeight * 0.72, 520);
  const size = Math.floor(maxW / GRID) * GRID;
  canvas.width = size;
  canvas.height = size;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function audioCtx(){
  if(!window._ac) window._ac = new (window.AudioContext || window.webkitAudioContext)();
  return window._ac;
}
function beep(freq, dur, type = 'square', vol = 0.13){
  if(!soundOn) return;
  try {
    const ac = audioCtx();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g).connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + dur);
  } catch(e){}
}
function haptic(pattern = 12){
  try { if(navigator.vibrate) navigator.vibrate(pattern); } catch(e){}
}

let wakeLock = null;
async function requestWakeLock(){
  try {
    if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch(e){}
}

function setMode(m){
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === m);
  });
}

function getBaseSpeed(){
  if(mode === 'easy') return 150;
  if(mode === 'hard') return 92;
  return 118;
}
function getMinSpeed(){
  if(mode === 'easy') return 85;
  if(mode === 'hard') return 46;
  return 60;
}
function getSpeedFactor(){
  if(mode === 'easy') return 1.0;
  if(mode === 'hard') return 2.1;
  return 1.5;
}

function init(){
  const c = cols(), r = rows();
  const midX = Math.floor(c / 2);
  const midY = Math.floor(r / 2);
  snake = [
    {x: midX, y: midY},
    {x: midX - 1, y: midY},
    {x: midX - 2, y: midY}
  ];
  headSmooth = {x: midX, y: midY};
  dir = {x:1, y:0};
  nextDir = {x:1, y:0};
  score = 0;
  gameOver = false;
  started = false;
  paused = false;
  speed = getBaseSpeed();
  multiplier = 1;
  multTimer = 0;
  powerup = null;
  particles = [];
  combo = 0;
  maxCombo = 0;
  nearMiss = 0;
  trail = [];
  milestonesHit = new Set();
  scoreEl.textContent = '0';
  scoreEl.classList.remove('bump');
  multEl.textContent = '';
  comboEl.textContent = '';
  multTimerEl.textContent = '';
  document.getElementById('pauseBtn').textContent = '⏸';

  overlay.classList.remove('hidden');
  overlayTitle.textContent = 'SNAKE';
  overlayTitle.classList.remove('over');
  overlaySub.textContent = 'Eat food. Build combos. Don\'t crash.';
  overlayScore.textContent = '';
  newBestEl.classList.add('hidden');
  bestLine.textContent = best > 0 ? `Your best: ${best}` : '';
  modeRow.classList.remove('hidden');
  startHint.classList.remove('hidden');

  spawnFood();
}

function spawnFood(){
  let pos;
  const c = cols(), r = rows();
  do {
    pos = {x: Math.floor(Math.random() * c), y: Math.floor(Math.random() * r)};
  } while (
    snake.some(s => s.x === pos.x && s.y === pos.y) ||
    (powerup && powerup.x === pos.x && powerup.y === pos.y)
  );
  food = pos;
}

function spawnPowerup(){
  let pos;
  const c = cols(), r = rows();
  do {
    pos = {x: Math.floor(Math.random() * c), y: Math.floor(Math.random() * r)};
  } while (
    snake.some(s => s.x === pos.x && s.y === pos.y) ||
    (food && food.x === pos.x && food.y === pos.y)
  );
  powerup = pos;
  setTimeout(() => {
    if (powerup === pos) powerup = null;
  }, 6500);
}

function setDir(x, y){
  if (x === -dir.x && y === -dir.y) return;
  nextDir = {x, y};
  if (!started) {
    started = true;
    overlay.classList.add('hidden');
    requestWakeLock();
    if (window._ac && window._ac.state === 'suspended') window._ac.resume();
  }
}

document.addEventListener('keydown', e => {
  switch (e.key) {
    case 'ArrowUp': case 'w': case 'W': setDir(0, -1); e.preventDefault(); break;
    case 'ArrowDown': case 's': case 'S': setDir(0, 1); e.preventDefault(); break;
    case 'ArrowLeft': case 'a': case 'A': setDir(-1, 0); e.preventDefault(); break;
    case 'ArrowRight': case 'd': case 'D': setDir(1, 0); e.preventDefault(); break;
    case ' ':
      if (gameOver) restartGame();
      else if (!started) { started = true; overlay.classList.add('hidden'); requestWakeLock(); }
      else togglePause();
      e.preventDefault();
      break;
  }
});

function toggleSound(){
  soundOn = !soundOn;
  document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
}
function togglePause(){
  if (!started || gameOver) return;
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? '▶' : '⏸';
}
function toggleDpad(){
  const dpad = document.getElementById('dpad');
  const btn = document.getElementById('dpadBtn');
  dpad.classList.toggle('dpad-hidden');
  btn.classList.toggle('active-toggle');
}

function burst(x, y, color, n = 14){
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1.8 + Math.random() * 3.8;
    particles.push({
      x: x * GRID + GRID / 2,
      y: y * GRID + GRID / 2,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1,
      color,
      size: 2 + Math.random() * 3.5
    });
  }
  shake = Math.max(shake, 10);
}

function showMilestone(text){
  milestoneEl.textContent = text;
  milestoneEl.classList.add('show');
  setTimeout(() => milestoneEl.classList.remove('show'), 900);
  beep(520, 0.12, 'triangle', 0.16);
  beep(780, 0.18, 'triangle', 0.12);
}

function checkMilestones(){
  const marks = [10, 25, 50, 75, 100, 150];
  for (const m of marks) {
    if (score >= m && !milestonesHit.has(m)) {
      milestonesHit.add(m);
      showMilestone(m + '!');
      break;
    }
  }
}

function update(){
  if (gameOver || !started || paused) return;
  if (hitStop > 0) { hitStop--; return; }

  if (multTimer > 0) {
    multTimer -= speed;
    const secs = Math.ceil(multTimer / 1000);
    multTimerEl.textContent = secs > 0 ? secs + 's' : '';
    if (multTimer <= 0) {
      multiplier = 1;
      multEl.textContent = '';
      multTimerEl.textContent = '';
    }
  }

  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  const c = cols(), r = rows();

  const distWall = Math.min(head.x, c - 1 - head.x, head.y, r - 1 - head.y);
  if (distWall <= 1 && !gameOver) {
    nearMiss = 8;
  }

  if (head.x < 0 || head.x >= c || head.y < 0 || head.y >= r) {
    endGame();
    return;
  }
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    endGame();
    return;
  }

  snake.unshift(head);
  headSmooth.x = head.x;
  headSmooth.y = head.y;

  trail.push({x: head.x, y: head.y, life: 1});
  if (trail.length > 8) trail.shift();

  if (food && head.x === food.x && head.y === food.y) {
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    const comboMult = Math.min(1 + Math.floor((combo - 1) / 2), 4);
    const points = multiplier * comboMult;
    score += points;
    scoreEl.textContent = score;
    scoreEl.classList.add('bump');
    setTimeout(() => scoreEl.classList.remove('bump'), 120);
    scorePop = 1;

    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('snakeBest', best);
    }

    comboEl.textContent = combo >= 2 ? `COMBO x${combo}` : '';
    multEl.textContent = (multiplier > 1 || comboMult > 1) ? `x${multiplier * comboMult}` : '';

    burst(food.x, food.y, '#f87171', 16);
    beep(620 + combo * 40, 0.07, 'square');
    haptic(14 + combo * 2);
    spawnFood();
    speed = Math.max(getMinSpeed(), getBaseSpeed() - score * getSpeedFactor());
    if (Math.random() < 0.32 && !powerup) spawnPowerup();
    checkMilestones();
  }
  else if (powerup && head.x === powerup.x && head.y === powerup.y) {
    score += 6 * multiplier;
    scoreEl.textContent = score;
    scoreEl.classList.add('bump');
    setTimeout(() => scoreEl.classList.remove('bump'), 120);
    scorePop = 1;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('snakeBest', best);
    }
    burst(powerup.x, powerup.y, '#fbbf24', 24);
    multiplier = 2;
    multTimer = 5200;
    multEl.textContent = 'x2';
    multTimerEl.textContent = '5s';
    speed = Math.max(getMinSpeed() - 6, speed - 20);
    powerup = null;
    beep(880, 0.15, 'triangle');
    haptic(35);
    checkMilestones();
  }
  else {
    snake.pop();
    if (combo > 0) {
      combo = 0;
      comboEl.textContent = '';
      if (multiplier <= 1) multEl.textContent = '';
    }
  }

  if (nearMiss > 0) nearMiss--;
}

function endGame(){
  gameOver = true;
  hitStop = 14;
  shake = 18;
  burst(snake[0].x, snake[0].y, '#ef4444', 30);

  for (let i = 0; i < Math.min(snake.length, 6); i++) {
    setTimeout(() => {
      if (snake[i]) burst(snake[i].x, snake[i].y, '#f87171', 8);
    }, i * 40);
  }

  const isNewBest = score > 0 && score >= best;
  if (isNewBest) {
    best = score;
    bestEl.textContent = best;
    localStorage.setItem('snakeBest', best);
  }

  overlay.classList.remove('hidden');
  overlayTitle.textContent = 'GAME OVER';
  overlayTitle.classList.add('over');
  overlaySub.textContent = maxCombo >= 3 ? `Max combo: x${maxCombo}` : '';
  overlayScore.textContent = score;
  bestLine.textContent = `Best: ${best}`;
  modeRow.classList.add('hidden');
  startHint.classList.add('hidden');

  if (isNewBest) newBestEl.classList.remove('hidden');
  else newBestEl.classList.add('hidden');

  beep(160, 0.4, 'sawtooth');
  haptic([50, 30, 50, 30, 80]);

  if (wakeLock) {
    try { wakeLock.release(); } catch(e){}
    wakeLock = null;
  }
}

function restartGame(){
  init();
  started = true;
  overlay.classList.add('hidden');
  requestWakeLock();
  if (window._ac && window._ac.state === 'suspended') window._ac.resume();
}

function draw(){
  shake *= 0.80;
  if (shake < 0.2) shake = 0;
  const sx = (Math.random() - 0.5) * shake;
  const sy = (Math.random() - 0.5) * shake;

  ctx.save();
  ctx.translate(sx, sy);

  const g = ctx.createRadialGradient(
    canvas.width / 2, canvas.height / 2, 8,
    canvas.width / 2, canvas.height / 2, canvas.width * 0.85
  );
  g.addColorStop(0, '#1a2333');
  g.addColorStop(1, '#0a0f1e');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (nearMiss > 0) {
    const alpha = nearMiss / 10;
    ctx.strokeStyle = `rgba(248,113,113,${alpha * 0.55})`;
    ctx.lineWidth = 4;
    ctx.strokeRect(3, 3, canvas.width - 6, canvas.height - 6);
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= cols(); i++) {
    ctx.beginPath();
    ctx.moveTo(i * GRID, 0);
    ctx.lineTo(i * GRID, canvas.height);
    ctx.stroke();
  }
  for (let j = 0; j <= rows(); j++) {
    ctx.beginPath();
    ctx.moveTo(0, j * GRID);
    ctx.lineTo(canvas.width, j * GRID);
    ctx.stroke();
  }

  trail.forEach((t, i) => {
    t.life -= 0.08;
    if (t.life <= 0) return;
    ctx.globalAlpha = t.life * 0.25;
    ctx.fillStyle = '#22c55e';
    const s = (GRID - 6) * t.life;
    ctx.beginPath();
    ctx.roundRect(t.x * GRID + (GRID - s) / 2, t.y * GRID + (GRID - s) / 2, s, s, 4);
    ctx.fill();
  });
  trail = trail.filter(t => t.life > 0);
  ctx.globalAlpha = 1;

  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.90;
    p.vy *= 0.90;
    p.life -= 0.036;
    if (p.life <= 0) return false;
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    return true;
  });

  if (food) {
    const t = Date.now() / 190;
    const pulse = 1 + Math.sin(t) * 0.17;
    ctx.shadowColor = '#f87171';
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#f87171';
    ctx.beginPath();
    ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, (GRID / 2 - 2.2) * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  if (powerup) {
    const t = Date.now() / 130;
    const pulse = 1 + Math.sin(t) * 0.22;
    ctx.shadowColor = '#fbbf24';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.arc(powerup.x * GRID + GRID / 2, powerup.y * GRID + GRID / 2, (GRID / 2 - 1.2) * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#0a0f1e';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('2x', powerup.x * GRID + GRID / 2, powerup.y * GRID + GRID / 2 + 4);
  }

  snake.forEach((s, i) => {
    const isHead = i === 0;
    const progress = i / Math.max(snake.length - 1, 1);

    if (isHead) {
      ctx.shadowColor = '#4ade80';
      ctx.shadowBlur = 14;
    } else {
      ctx.shadowBlur = 0;
    }

    const green = isHead ? '#4ade80' : `rgb(${34 + progress * 20}, ${197 - progress * 40}, ${94 - progress * 20})`;
    ctx.fillStyle = green;

    const pad = 1.8;
    const r = 5.5;
    const x = s.x * GRID + pad;
    const y = s.y * GRID + pad;
    const w = GRID - pad * 2;
    const h = GRID - pad * 2;

    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
    ctx.shadowBlur = 0;

    if (isHead) {
      ctx.fillStyle = '#0a0f1e';
      const ex = s.x * GRID + GRID / 2 + dir.x * 3.5;
      const ey = s.y * GRID + GRID / 2 + dir.y * 3.5;
      ctx.beginPath();
      ctx.arc(ex - 3.4, ey - 2.4, 2.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ex + 3.4, ey - 2.4, 2.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ex - 3.9, ey - 3.0, 0.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ex + 2.9, ey - 3.0, 0.8, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  if (scorePop > 0) {
    scorePop -= 0.04;
    ctx.globalAlpha = Math.max(0, scorePop);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    const popText = '+' + (multiplier * Math.min(1 + Math.floor((combo || 1) / 2), 4));
    ctx.fillText(popText, canvas.width / 2, canvas.height / 2 - 20 - scorePop * 50);
    ctx.globalAlpha = 1;
  }

  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 32px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
  }

  ctx.restore();
}

function loop(ts){
  if (!lastTime) lastTime = ts;
  acc += ts - lastTime;
  lastTime = ts;
  while (acc >= speed) {
    update();
    acc -= speed;
  }
  draw();
  requestAnimationFrame(loop);
}

// Touch / Swipe (primary control like Play Store games)
let touchStart = null;
canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  touchStart = {x: t.clientX, y: t.clientY};
  e.preventDefault();
}, {passive: false});
canvas.addEventListener('touchmove', e => e.preventDefault(), {passive: false});
canvas.addEventListener('touchend', e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 14) {
    if (!started && !gameOver) {
      started = true;
      overlay.classList.add('hidden');
      requestWakeLock();
    }
  } else {
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 14) setDir(1, 0);
      else if (dx < -14) setDir(-1, 0);
    } else {
      if (dy > 14) setDir(0, 1);
      else if (dy < -14) setDir(0, -1);
    }
  }
  touchStart = null;
  e.preventDefault();
}, {passive: false});

init();
requestAnimationFrame(loop);
</script>
</body>
